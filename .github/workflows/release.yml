name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    uses: frakment/.github/.github/workflows/npm-package-release-reusable.yml@434c77d270241a9c4f2cf61415f1660894e1735f
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      npm_token: ${{ secrets.NPM_TOKEN }}
